id = "workspace-tab-history"
name = "Workspace Tab History"
version = "0.3.0"
min_herdr_version = "0.7.0"
description = "Toggle recently focused workspaces and tabs"
platforms = ["linux", "macos"]

[[actions]]
id = "toggle"
title = "Toggle recent tabs"
contexts = ["workspace"]
command = ["bash", "toggle.sh"]

[[events]]
on = "tab.focused"
command = ["bash", "track.sh"]

[[events]]
on = "tab.closed"
command = ["bash", "track.sh"]

[[actions]]
id = "toggle-workspace"
title = "Toggle recent workspaces"
contexts = ["global"]
command = ["bash", "toggle-workspace.sh"]

[[events]]
on = "workspace.focused"
command = ["bash", "track-workspace.sh"]
